name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ============================
  #           CI
  # ============================
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout do código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🔍 Rodar ESLint
        run: npm run lint

      - name: 🏗️ Rodar Build
        run: npm run build

      - name: 📤 Upload do build para deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist


  # ============================
  #           CD
  # ============================
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🚀 Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
